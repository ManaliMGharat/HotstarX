<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="hx-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="hx-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background badge -->
  <rect width="48" height="48" rx="12" fill="#06101c"/>
  <rect width="46" height="46" x="1" y="1" rx="11" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Geometric Play-Prism Star / Hex / X Emblem -->
  <!-- Left dynamic chevron wing -->
  <path d="M12 11L25 24L12 37L17 37L29 25.5L29 22.5L17 11H12Z" fill="url(#hx-grad)" filter="url(#glow)"/>
  <!-- Right sleek intersecting chevron wing forming the X -->
  <path d="M36 11L23 24L36 37L31 37L19 25.5L19 22.5L31 11H36Z" fill="url(#hx-accent)" opacity="0.9"/>
  <!-- Core energy node -->
  <circle cx="24" cy="24" r="3.5" fill="#ffffff" />
</svg>