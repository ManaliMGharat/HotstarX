<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Electric Cyan to Violet Gradient for PrimeX Emblem -->
    <linearGradient id="px-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="55%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="px-grad-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="60%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <radialGradient id="px-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="px-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Midnight Navy Icon Base -->
  <rect width="64" height="64" rx="16" fill="#030712"/>
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(6,182,212,0.3)" stroke-width="1.5"/>

  <!-- Distinctive PrimeX Cinematic Emblem (Dynamic Intersecting Hyper-Wings) -->
  <!-- Left Wing -->
  <path
    d="M15 14L32 32L15 50L22 50L40 33.5L40 30.5L22 14H15Z"
    fill="url(#px-grad-left)"
    filter="url(#px-glow)"
  />
  <!-- Right Wing -->
  <path
    d="M49 14L32 32L49 50L42 50L24 33.5L24 30.5L42 14H49Z"
    fill="url(#px-grad-right)"
    opacity="0.95"
  />

  <!-- Core Radiant Energy Node -->
  <circle cx="32" cy="32" r="4.5" fill="url(#px-core)"/>
</svg>